[project]
name = "hh-mcp-ru"
version = "0.2.1"
description = "API hh.ru для ИИ-ассистентов: вакансии, отклики и приглашения, резюме, справочники, статистика зарплат"
keywords = ["mcp", "model-context-protocol", "hh", "hh.ru", "headhunter", "вакансии", "recruiting", "hr", "russia", "claude"]
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ilya Utov" }]
dependencies = [
    # Ядро живёт отдельным пакетом: пять серверов делят его, а не копируют.
    "schema-mcp-core>=0.2.0,<1",
]

[project.urls]
Repository = "https://github.com/ilyautov/hh-mcp-ru"
Issues = "https://github.com/ilyautov/hh-mcp-ru/issues"
Changelog = "https://github.com/ilyautov/hh-mcp-ru/blob/main/CHANGELOG.md"

[project.scripts]
hh-mcp-ru = "hh_mcp.server:cli"
hh-mcp = "hh_mcp.server:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hh_mcp"]

[tool.setuptools.package-data]
hh_mcp = ["endpoints.yaml", "entities.yaml"]
